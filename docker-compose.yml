services:
  postgres:
    image: postgres:17-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: once
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:debian
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: supersecret
      MYSQL_DATABASE: once
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -p$$MYSQL_ROOT_PASSWORD
      timeout: 1s
      retries: 30
      interval: 1s

  mariadb:
    image: mariadb:latest
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: supersecret
      MYSQL_DATABASE: once
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -p$$MYSQL_ROOT_PASSWORD
      timeout: 1s
      retries: 30
      interval: 1s
